<!DOCTYPE html>
<html>

<head>
    <title>Delicious Cake Hub - Login</title>

     <img src="logo.png" alt="Logo" style="width:300px;height:300px;object-fit:contain;">

    <!-- Connect sa external CSS -->
    <link rel="stylesheet" href="style.css">
    

</head>

<body>

    <!-- Login box -->
    <div class="login">

        <!-- Logo -->
        <bold><h1>Delicious Cake Hub</h1></bold>

        <!-- Login form -->
        <form action="index.html">

            <!-- Username -->
            <label>Username:</label>
            <input type="text"
                   placeholder="Enter username"
                   required>
                   <br>

            <!-- Password -->
            <label>Password:</label>
            <input type="password"
                   placeholder="Enter password"
                   required>
                   <br>

            <!-- Login button -->
            <button type="submit">
                Login
            </button>

        </form>



        <!-- Simple dialog box -->
        <div class="dialog">
            Welcome to Delicious Cake Hub!         
                 Just click here
        </div>

    </div>

</body>
</html>
